<style>
  /* Layout concept: a vertical seam splits the hero into two worlds (navy
     consultant / green coach) that meet at the name; each sub-page below
     continues its side's palette as a full page, reached by hash route. */
  :root{
    --paper:#F7F5F0; --ink:#15181B; --ink-soft:#5B6269; --line:#DEDAD1;
    --navy:#1C3350; --navy-soft:#EBEFF3; --navy-tint:#334B6B;
    --green:#14523A; --green-soft:#E8F0EA; --green-tint:#1E6B4C;

    --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15181B; --ink:#F3F1EB; --ink-soft:#A8ACB0; --line:#2B2F33;
      --navy:#2A4A72; --navy-soft:#1C2A3B; --navy-tint:#3E5E86;
      --green:#2E7A58; --green-soft:#17261E; --green-tint:#3B9469;
      --orange:#F0914F;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15181B; --ink:#F3F1EB; --ink-soft:#A8ACB0; --line:#2B2F33;
    --navy:#2A4A72; --navy-soft:#1C2A3B; --navy-tint:#3E5E86;
    --green:#2E7A58; --green-soft:#17261E; --green-tint:#3B9469;
    --orange:#F0914F;
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.55}
  h1,h2,h3,.disp{font-family:var(--font-display);text-wrap:balance;letter-spacing:-0.01em}
  a{color:inherit}
  .wrap{max-width:860px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}

  .btn.ghost{background:transparent;border-color:currentColor}
  .btn.solid-navy{background:var(--navy);color:#fff}
  .btn.solid-green{background:var(--green);color:#fff}

  .navlinks button.active{color:var(--ink);background:var(--line)}

  /* ---------- HOME ---------- */
  /* ---- hero: one photo, two worlds ---- */

  .stage::before{left:0;background:linear-gradient(180deg,#14253d 0%,#1a2a42 60%,#232f42 100%)}
  .stage::after{right:0;background:linear-gradient(180deg,#123f2a 0%,#14492f 60%,#165636 100%)}
  .stage img{position:relative;z-index:1;height:100%;width:auto;aspect-ratio:1047/737;max-width:none;object-fit:cover;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
  .sides{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr calc(var(--ph)*.75) 1fr;grid-template-rows:auto auto auto auto auto 1fr;pointer-events:none}

  .intro-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-block:44px}
  .icard{border:1px solid var(--line);border-radius:18px;padding:0;display:flex;flex-direction:column;min-width:0;cursor:pointer;background:var(--paper);overflow:hidden;text-decoration:none;transition:transform .18s ease, box-shadow .18s ease}
  .icard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.10)}
  .icard .cap{padding:16px 24px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .icard.nv .cap{background:var(--navy)} .icard.gr .cap{background:var(--green)}
  .icard .in{padding:22px 24px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
  .icard h3{margin:0;font-size:21px;color:var(--ink)}
  .icard p{margin:0;color:var(--ink-soft);font-size:14.5px}
  .icard ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--ink)}
  .icard li{padding-left:18px;position:relative}
  .icard li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:2px;background:var(--orange)}
  .icard .go{font-weight:700;font-size:13.5px;margin-top:auto;padding-top:12px}
  .icard.nv .go{color:var(--navy)} .icard.gr .go{color:var(--green)}

  .contact{background:var(--ink);color:var(--paper);border-radius:22px;padding:36px clamp(22px,4vw,44px);margin-block:8px 56px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
  .contact h2{margin:0 0 6px;font-size:clamp(22px,3vw,30px)}
  .contact p{margin:0;opacity:.75;font-size:14.5px}
  .contact .acts{display:flex;flex-wrap:wrap;gap:10px}
  .contact .btn{background:var(--paper);color:var(--ink)}
  .contact .btn.ghost{background:transparent;color:var(--paper)}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;padding-block:28px}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:no-preference){
    #app > *{animation:rise .5s ease both}
    #app > *:nth-child(2){animation-delay:.08s}
  }

  /* ---------- SUBPAGE SHELL ---------- */
  .pagehero{position:relative;overflow:hidden;padding-block:48px 40px;color:#fff}
  .pagehero.nv{background:linear-gradient(160deg,var(--navy),var(--navy-tint))}
  .pagehero.gr{background:linear-gradient(200deg,var(--green),var(--green-tint))}
  .pagehero .motif{position:absolute;right:-40px;top:0;bottom:0;width:min(46%,420px);opacity:.13;pointer-events:none}
  .pagehero .wrap{position:relative}
  .pagehero .eyebrow{color:#fff}
  .pagehero h1{font-size:clamp(32px,5.5vw,50px);margin:10px 0 8px;color:#fff}
  .pagehero .role{font-size:16px;font-weight:600;opacity:.9;margin:0 0 16px}
  .pagehero p.lede{max-width:600px;opacity:.85;font-size:16px;margin:0 0 22px}
  .pagehero .back{color:#fff;opacity:.8}
  .pagehero .btn.solid{background:#fff;color:var(--ink)}
  .pagehero .btn.ghost{color:#fff}
  .pagehero .stat-row{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.22)}
  .pagehero.nv .stat{background:var(--navy)} .pagehero.gr .stat{background:var(--green)}
  .pagehero .stat span{color:#fff;opacity:.75}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:28px 0 8px}
  .stat{background:var(--paper);padding:18px 16px;text-align:center}
  .stat b{display:block;font-family:var(--font-display);font-size:clamp(20px,4vw,28px);font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--ink-soft)}

  section.block{padding-block:40px;border-bottom:1px solid var(--line)}
  section.block h2{font-size:22px;margin:0 0 20px}

  .timeline{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
  .trow{position:relative;display:grid;grid-template-columns:140px 1fr;gap:18px;padding:0 0 28px 24px}
  .trow:last-child{padding-bottom:0}
  .trow::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--navy)}
  .trow:first-child::before{background:var(--orange);border-color:var(--orange)}
  .trow .when{font-size:13px;color:var(--ink-soft);font-weight:600}
  .trow .role{font-weight:700;margin:0 0 3px;font-size:15.5px}
  .trow .org{font-size:13.5px;color:var(--ink-soft);margin:0 0 8px}
  .trow ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .tile{border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
  .tile .k{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--orange)}
  .tile h3{margin:8px 0 6px;font-size:17px}
  .tile p{margin:0;font-size:14px;color:var(--ink-soft)}
  .flow5{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .flow5 div{padding:16px 14px;border-left:1px solid var(--line);min-width:0}
  .flow5 div:first-child{border-left:none}
  .flow5 .k{font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--green);letter-spacing:.08em}
  .flow5 b{display:block;font-size:14.5px;margin:6px 0 3px}
  .flow5 span{font-size:12.5px;color:var(--ink-soft)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap}

  .photo-slot{border:2px dashed var(--line);border-radius:18px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--ink-soft);font-size:13px;text-align:center;padding:20px}

  .edu-item{display:flex;justify-content:space-between;gap:16px;padding-block:14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .edu-item:first-child{border-top:none}
  .edu-item b{font-size:14.5px}
  .edu-item span{font-size:13px;color:var(--ink-soft)}

  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-soft);text-decoration:none;margin-bottom:18px;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}

  footer{padding-block:36px;color:var(--ink-soft);font-size:13.5px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center}

  @media (max-width:1079px){
    .hero2{--ph:auto}

    .side.l,.side.r{grid-column:auto;grid-row:auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left;border-radius:18px;padding:22px 20px 16px;min-height:0}
    .side.l{background:linear-gradient(170deg,#14253d,#26354d)}
    .side.r{background:linear-gradient(170deg,#123f2a,#1a5c3b)}
    .side.r .chipbox{align-items:flex-start}
    .scene{max-width:300px}

    .ovl{display:flex;position:absolute;left:50%;transform:translateX(-50%);bottom:0;z-index:2;width:100%;max-width:560px;justify-content:space-between;align-items:flex-end;gap:10px;padding:56px max(16px,env(safe-area-inset-left,0px)) 16px;background:linear-gradient(180deg,transparent,rgba(8,14,22,.72));color:#fff;pointer-events:none;box-sizing:border-box}
    .ovl span{display:flex;flex-direction:column;gap:3px;font-weight:800;font-size:15px;line-height:1.2;max-width:48%;text-shadow:0 1px 8px rgba(0,0,0,.45)}

  }
  @media (max-width:640px){

    .chipbox small{font-size:9.5px;letter-spacing:.12em;line-height:1.3}
    .chipbox{margin-top:0;width:100%;gap:8px}
    .side.r .chipbox{align-items:stretch}
    .logos{min-height:58px;gap:6px;padding:8px;border-radius:11px;justify-content:center;width:100%}
    .markcol{gap:4px}

    .markcol:nth-child(5) img{height:24px;margin-top:-2px}

    .side .go{font-size:12.5px;margin-top:auto}
  }
  @media (max-width:640px){
    .sides{grid-template-columns:1fr}
    .intro-cards{grid-template-columns:1fr}
    .statement{grid-template-columns:1fr;gap:18px;padding-block:36px 28px}

    .grid3{grid-template-columns:1fr}
    .flow5{grid-template-columns:1fr}

const ROUTES = {home:renderHome, consultant:renderConsultant, coach:renderCoach};

function go(route){
  if(!ROUTES[route]) route='home';
  location.hash = route==='home' ? '' : route;
  render(route);
}

function render(route){
  document.getElementById('app').innerHTML = ROUTES[route]();
  document.querySelectorAll('.navlinks button').forEach(b=>b.classList.toggle('active', b.dataset.r===route));
  window.scrollTo(0,0);
}

function routeFromHash(){
  const h = (location.hash||'').replace('#','');
  return ROUTES[h] ? h : 'home';
}

window.addEventListener('hashchange', ()=>render(routeFromHash()));

function boot(){ render(routeFromHash()); }
if (window.claude?.hot?.ready) { window.claude.hot.ready(boot); } else { boot(); }
</script>
